phy:
  modulation: 64qam
  fft_size: 1024
  cp_length: 128
  subcarrier_spacing_hz: 15000

resource_grid:
  guard_left: 64
  guard_right: 63
  dc_null: true
  pilots:
    enabled: true
    spacing: 4
    offset: 0

synchronization:
  enabled: true
  preamble_enabled: true
  zc_root: 29
  timing_offset_samples: 0
  timing_search_samples: 32
  cfo_hz: 0
  # Intended oscillator mismatch is bounded by the hardware at +/-20 ppm.
  sfo_ppm: 20
  pilot_phase_tracking: false
  phase_reference_tracking: true
  phase_reference_count: 8
  pilot_phase_min_coherence: 0.8
  sfo_tracking: true
  # At <=20 ppm, one-pass frequency-domain phase-slope correction retains
  # essentially all useful throughput and avoids a 248 Mtap-MAC/s resampler.
  sfo_resampling: false
  sfo_resampling_interpolator: sinc8

receiver:
  channel_estimation: ls_linear
  channel_estimation_taps: 10
  detector: mmse

mimo:
  mode: spatial_multiplexing
  nt: 2
  nr: 2
  layers: 2
  detector: mmse

channel:
  profile: rayleigh
  # 100 Hz continuous Doppler is a conservative engineering validation point
  # for 1-2 m/s operation unless the RF carrier is above about 15 GHz.
  doppler_hz: 100
  doppler_model: continuous

simulation:
  frames: 200
  snr_db: 40
  seed: 23063
  channel_seed: 33063
  noise_seed: 43063
