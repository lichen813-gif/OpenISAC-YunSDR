phy:
  modulation: 64qam
  fft_size: 64
  cp_length: 16
  subcarrier_spacing_hz: 15000

resource_grid:
  guard_left: 0
  guard_right: 0
  dc_null: true
  pilots:
    enabled: true
    spacing: 8
    offset: 0

synchronization:
  enabled: true
  pilot_phase_tracking: true
  pilot_phase_min_coherence: 0.9
  timing_offset_samples: 5
  timing_search_samples: 16
  cfo_hz: 500

mimo:
  mode: stbc
  scheme: alamouti
  nt: 2
  nr: 2
  layers: 1
  stbc:
    pairing: time
    tx_power_normalize: true

channel:
  profile: tdl
  taps:
    - delay_samples: 0
      gain_db: 0.0
      phase_deg: 0.0
    - delay_samples: 3
      gain_db: -4.0
      phase_deg: 45.0
    - delay_samples: 9
      gain_db: -8.0
      phase_deg: -80.0

simulation:
  frames: 1000
  snr_db: [10, 15, 20, 25, 30, 35]
  seed: 23063
