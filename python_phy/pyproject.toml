[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openisac-phy"
version = "0.1.0"
description = "Cross-platform Python golden model for the OpenISAC physical layer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
openisac-phy-sim = "openisac_phy.cli:main"
openisac-constellation = "openisac_phy.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openisac_phy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
